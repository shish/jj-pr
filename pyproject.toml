[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jj-pr"
version = "0.1.0"
description = "Unified CLI for multiple code review forges (GitHub, Phabricator, Gerrit)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
jj-pr = "jjpr.main:run"

[dependency-groups]
dev = [
    "filelock>=3.29.4",
    "ipython>=9.15.0",
    "prek>=0.4.5",
    "pytest>=9.1.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.1.0",
    "tenacity>=9.1.4",
    "ty>=0.0.49",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["BLE001", "B008", "SIM117", "RUF015"]

[tool.hatch.build.targets.wheel]
packages = ["src/jjpr"]

[tool.coverage.run]
omit = ["*_test.py", "conftest.py", "jj_cli.py"]

[tool.pytest.ini_options]
#testpaths = ["tests/"]
#python_files = ["*.py"]
addopts = "--cov-report=term-missing --strict-markers"
markers = [
    "integration: marks tests as integration tests requiring external services",
    "gerrit: marks tests as Gerrit forge tests",
    "github: marks tests as GitHub forge tests",
    "phabricator: marks tests as Phabricator forge tests",
    "demo: marks tests as Demo forge tests",
]
